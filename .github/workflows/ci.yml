name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The dependencies that ship with the package, without a known vulnerability of high severity or worse.
      - run: npm audit --omit=dev --audit-level=high
        if: matrix.os == 'ubuntu-latest'
      - run: npm run lint
      - run: npm test
