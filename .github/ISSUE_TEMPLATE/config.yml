    about: Anything that is not about lockpicking goes to RPG Engine itself.
  - name: A question
    url: https://github.com/stefanocaronia/rpg-engine/discussions/categories/help
    about: How to install, connect your AI or do something in the game.
  - name: An idea
    url: https://github.com/stefanocaronia/rpg-engine/discussions/categories/ideas
    about: What you would like the game to do, to share and vote on in the Discussions.
