# Updates once a week, each ecosystem's minor and patch ones in one pull request, so that CI tests them together; a major one comes in a pull request of its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # TypeScript's next major waits for typescript-eslint; Node's types stay those of the oldest Node we support.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
